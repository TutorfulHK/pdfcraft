[package]
name = "pdfcraft-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lean headless WebAssembly library for PDF byte jobs: merge, extract, images to PDF, compress, ink annotations, page overlays"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Deliberately not `pdfcraft-engine`: that pulls in the JavaScript interpreter, XFA, OCR and
# signing, none of which these jobs need.
[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-edit = { workspace = true }
pdfcraft-create = { workspace = true }
pdfcraft-optimize = { workspace = true }
pdfcraft-measure = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
png = "0.18"
