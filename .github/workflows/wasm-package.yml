# Build the headless WebAssembly library (crates/wasm) and publish it as the npm package
# @tutorfulhk/pdfcraft-wasm to GitHub Packages, on tags `wasm-v<version>` (e.g. wasm-v0.4.0).
name: wasm package

on:
  push:
    tags: ["wasm-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wasm-package-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@tutorfulhk"
      - name: Install wasm-bindgen-cli (Cargo.lock version) and binaryen
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          cargo install wasm-bindgen-cli --locked --version "$version"
          npm install -g binaryen
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli
      - name: Native tests of the library
        run: cargo test -p pdfcraft-wasm
      - name: Build the package
        run: |
          version="${GITHUB_REF_NAME#wasm-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)-dev.${GITHUB_RUN_NUMBER}"
          fi
          VERSION="$version" packaging/wasm/build.sh "$RUNNER_TEMP/pkg" | tee "$RUNNER_TEMP/size.txt"
          tail -n 1 "$RUNNER_TEMP/size.txt" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-wasm
          path: ${{ runner.temp }}/pkg
      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/wasm-v')
        working-directory: ${{ runner.temp }}/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
